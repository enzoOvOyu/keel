name: Keel platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: keel_test
          POSTGRES_DB: keel_test_auth
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['15433:5432']
        options: >-
          --label io.keel.test-environment=disposable
          --health-cmd "pg_isready -U keel_test -d keel_test_auth"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      KEEL_TEST_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_auth?sslmode=disable
      KEEL_TEST_SSH_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_ssh?sslmode=disable
      KEEL_TEST_EXECUTION_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_execution?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_execution
      - run: docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_ssh
      - name: Full checks with failure diagnostics
        run: |
          set -euo pipefail
          if make check 2>&1 | tee /tmp/keel-ci-check.log; then exit 0; fi
          python3 -c 'from pathlib import Path; tail = Path("/tmp/keel-ci-check.log").read_text()[-12000:]; print("::error title=make check failed::" + tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          exit 1
      - name: Compile Linux arm64 control-plane, Agent and preflight binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          set -euo pipefail
          keel_arm64_build_dir="$(mktemp -d /tmp/keel-arm64-build.XXXXXXXX)"
          trap 'rm -rf "$keel_arm64_build_dir"' EXIT
          go build -trimpath -o "$keel_arm64_build_dir/" ./cmd/keel-api ./cmd/keel-admin ./cmd/keel-worker ./cmd/keel-sim ./cmd/keel-ssh-runner ./cmd/keel-agent ./cmd/keel-preflight ./cmd/keel-initrd ./cmd/keel-provision
      - name: Compile Linux amd64 Agent binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          keel_agent_build_dir="$(mktemp -d /tmp/keel-agent-build.XXXXXXXX)"
          trap 'rm -rf "$keel_agent_build_dir"' EXIT
          go build -trimpath -ldflags="-X main.version=$GITHUB_SHA" -o "$keel_agent_build_dir/keel-agent" ./cmd/keel-agent
          go build -trimpath -o "$keel_agent_build_dir/keel-preflight" ./cmd/keel-preflight
          "$keel_agent_build_dir/keel-agent" version
      - name: Provisioning offline overlay with actual static helper binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          keel_provision_cli_dir="$(mktemp -d /tmp/keel-provision-cli.XXXXXXXX)"
          trap 'rm -rf "$keel_provision_cli_dir"' EXIT
          go build -trimpath -o "$keel_provision_cli_dir/" ./cmd/keel-admin ./cmd/keel-preflight ./cmd/keel-ssh-runner
          export KEEL_TEST_PROVISION_ADMIN_BIN="$keel_provision_cli_dir/keel-admin"
          export KEEL_TEST_PROVISION_PREFLIGHT_BIN="$keel_provision_cli_dir/keel-preflight"
          export KEEL_TEST_PROVISION_SSH_HELPER_BIN="$keel_provision_cli_dir/keel-ssh-runner"
          go test -p=1 -count=1 -v ./internal/mediamanifest -run '^TestInstallerOverlayRealHelperCLI$'
      - name: Agent integration and approved provisioning execution
        env:
          KEEL_TEST_AGENT_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_agent_ci?sslmode=disable
        run: |
          set -euo pipefail
          docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_agent_ci
          keel_agent_test_dir="$(mktemp -d /tmp/keel-agent-test.XXXXXXXX)"
          trap 'rm -rf "$keel_agent_test_dir"' EXIT
          export KEEL_TEST_AGENT_ADMIN_BIN="$keel_agent_test_dir/keel-admin"
          export KEEL_TEST_AGENT_AGENT_BIN="$keel_agent_test_dir/keel-agent"
          export KEEL_TEST_AGENT_WORKER_BIN="$keel_agent_test_dir/keel-worker"
          go build -o "$KEEL_TEST_AGENT_ADMIN_BIN" ./cmd/keel-admin
          go build -o "$KEEL_TEST_AGENT_AGENT_BIN" ./cmd/keel-agent
          go build -o "$KEEL_TEST_AGENT_WORKER_BIN" ./cmd/keel-worker
          go test -p=1 -race -count=1 -v ./internal/agentidentity ./internal/platform ./internal/execution -run '^(TestAgent|TestHostFlow|TestHostMedia|TestProvisionExecutionKernelPostgres$)'
      - name: PostgreSQL authentication, authorization, and browser integration
        env:
          KEEL_ADMIN_BINARY: /tmp/keel-ci-admin
          KEEL_AUTH_TEST_BASE_URL: http://127.0.0.1:3102
          KEEL_AUTH_BROWSER_CREDENTIALS_FILE: /tmp/keel-auth-browser-credentials.json
          KEEL_ENV: development
          KEEL_INSECURE_DEV_COOKIE: 'true'
          KEEL_PUBLIC_ORIGINS: http://127.0.0.1:3102,http://localhost:3102
          KEEL_LISTEN_ADDR: 127.0.0.1:3102
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_http
          export KEEL_DATABASE_URL='postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_http?sslmode=disable'
          export KEEL_TEST_DATABASE_URL="$KEEL_DATABASE_URL"
          go build -o /tmp/keel-ci-admin ./cmd/keel-admin
          go build -o /tmp/keel-ci-api ./cmd/keel-api
          /tmp/keel-ci-admin migrate
          /tmp/keel-ci-api > /tmp/keel-ci-api.log 2>&1 &
          keel_ci_api_pid=$!
          trap 'kill "$keel_ci_api_pid" 2>/dev/null || true; rm -f /tmp/keel-auth-browser-credentials.json' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:3102/healthz
          python3 scripts/check-auth-integration.py
          python3 scripts/check-control-integration.py
          npm install --prefix /tmp/keel-browser-check --save-exact playwright@1.64.0
          /tmp/keel-browser-check/node_modules/.bin/playwright install --with-deps chromium
          node scripts/check-auth-browser.mjs
          node scripts/check-control-browser.mjs
          KEEL_BASE_URL=http://127.0.0.1:3102 KEEL_PLAYWRIGHT_MODULE=/tmp/keel-browser-check/node_modules/playwright/index.mjs node scripts/check-browser.mjs
      - name: Shared UI migration, local fonts and actual page interaction
        env:
          KEEL_UI_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/check-ui-migration-integration.py
      - name: Agent read-only launch, durable receipts and browser reconciliation
        env:
          KEEL_TEST_AGENT_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_agent_ci?sslmode=disable
        run: |
          export KEEL_TEST_AGENT_STATIC_DIR="$GITHUB_WORKSPACE/web/dist"
          export KEEL_TEST_AGENT_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/check-agent-launch-browser.mjs"
          go test -race -count=1 -v ./internal/agentidentity -run '^TestAgentReadOnlyLaunchBrowser$'
      - name: Domain-key SSH launch, PostgreSQL and browser integration
        env:
          KEEL_TEST_SSH_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_ssh_ui?sslmode=disable
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_ssh_ui
          export KEEL_TEST_SSH_STATIC_DIR="$GITHUB_WORKSPACE/web/dist"
          export KEEL_TEST_SSH_LAUNCH_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/check-ssh-launch-browser.mjs"
          go test -race -count=1 ./internal/taskrunner -run '^TestSSHReadOnlyLaunchBrowser$'
      - name: Signed OIDC, PostgreSQL and browser authentication
        env:
          KEEL_TEST_OIDC_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_oidc_ci?sslmode=disable
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_oidc_ci
          export KEEL_TEST_OIDC_STATIC_DIR="$GITHUB_WORKSPACE/web/dist"
          export KEEL_TEST_OIDC_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/check-oidc-browser.mjs"
          go test -race -count=1 ./internal/oidcauth
      - name: Verified LDAPS, PostgreSQL and browser authentication
        env:
          KEEL_TEST_LDAP_DATABASE_URL: postgresql://keel_test:isolated-ci-only@127.0.0.1:15433/keel_test_ldap_ci?sslmode=disable
        run: |
          docker exec '${{ job.services.postgres.id }}' createdb -U keel_test keel_test_ldap_ci
          export KEEL_TEST_LDAP_STATIC_DIR="$GITHUB_WORKSPACE/web/dist"
          export KEEL_TEST_LDAP_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/check-ldap-browser.mjs"
          go test -race -count=1 ./internal/ldapauth
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120 api
      - run: curl --fail http://127.0.0.1:3000/healthz
      - if: always()
        run: docker compose down
