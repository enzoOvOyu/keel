syntax = "proto3";
package keel.agent.v1;
option go_package = "github.com/enzoOvOyu/keel/internal/agentproto;agentproto";

// Identity, liveness and explicitly enabled bounded read-only task transport.
// Task payloads use the existing keel.task/v1 contract; no shell or telemetry.
// Enroll uses verified server TLS and a one-use secret delivered out of band.
// Heartbeats additionally requires the issued, currently active client cert.
service AgentIdentity {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Heartbeats(stream Heartbeat) returns (stream HeartbeatAck);
  rpc Tasks(stream TaskReport) returns (stream TaskRequest);
}
message EnrollRequest {
  string project_id = 1;
  string machine_id = 2;
  string serial_number = 3;
  string agent_version = 4;
  string enrollment_token = 5;
  bytes csr_pem = 6;
}
message EnrollResponse {
  string credential_id = 1;
  bytes certificate_pem = 2;
  bytes ca_certificate_pem = 3;
  string expires_at = 4;
}
message Heartbeat {
  string project_id = 1;
  string machine_id = 2;
  string serial_number = 3;
  string agent_version = 4;
  string boot_id = 5;
  uint64 sequence = 6;
}
message HeartbeatAck {
  string connection_id = 1;
  uint64 sequence = 2;
  string received_at = 3;
  uint32 next_heartbeat_seconds = 4;
}

// First report is an empty hello carrying the active heartbeat connection_id.
// Server acknowledges with an empty TaskRequest; later frames carry matching
// request IDs and bounded strict keel.task/v1 JSON. No persisted delivery queue.
message TaskRequest {
  string request_id = 1;
  bytes request_json = 2;
  int64 expires_at_unix_milli = 3; // delivery admission deadline, not task timeout
}
message TaskReport {
  string connection_id = 1;
  string request_id = 2;
  bytes observation_json = 3;
  string error = 4; // empty, rejected, unknown
}
