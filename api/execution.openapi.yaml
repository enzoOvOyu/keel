          "timeout_ms": {
            "type": "integer",
            "minimum": 100,
            "maximum": 30000,
            "default": 5000
          },
          "result_format": {
            "type": "string",
            "enum": [
              "",
              "json"
            ],
            "default": "",
            "description": "Empty keeps bounded text output. json requires one UTF-8 JSON object of at most 2048 bytes, depth at most 8 and at most 128 values; duplicate keys, trailing documents and nonfinite numbers fail the task. The command and receipt freeze this choice."
          },
          "prefer_cache": {
            "type": "boolean",
            "default": false,
            "description": "Probe the fixed owned media cache before the single script run. A verified hit omits body transfer; no body fallback or rerun after dispatch."
          }
        },
        "description": "Explicit selection of 1..32 trusted provisioned machines and an independently approved fixed-interpreter script artifact. Non-idempotent; no automatic retry."
      },
