{
  "openapi": "3.1.0",
  "info": {
    "title": "keel simulated execution API",
    "version": "0.1.0",
    "description": "Simulated execution contracts for flows, immutable flow versions, logical simulation targets, executions, task attempts, run control and reconciliation. The worker runs only explicitly simulated adapters: there is no device transport, so these contracts are not hardware acceptance. State-changing requests require an exact configured Origin, a session-bound X-CSRF-Token and an Idempotency-Key. Responses never include credential values or infrastructure secrets."
  },
  "tags": [
    {
      "name": "Simulation execution"
    }
  ],
