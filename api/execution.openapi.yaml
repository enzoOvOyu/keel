{
  "openapi": "3.1.0",
  "info": {
    "title": "Keel execution API",
    "version": "0.1.0",
    "description": "Durable simulation, Kea, fabric and opt-in bounded server SSH execution. SSH operations are allowlisted read-only queries, with operator-owned target/credential binding and pinned host keys. Simulation and isolated protocol evidence do not prove hardware acceptance. Mutations require exact Origin, session CSRF and Idempotency-Key; responses contain no credentials."
  },
  "tags": [
    {
      "name": "Simulation execution"
    },
    {
      "name": "Agent execution",
      "description": "Opt-in registered mTLS Agent read-only tasks through the unified execution kernel."
    }
  ],
