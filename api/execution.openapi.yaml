  "components": {
    "securitySchemes": {
      "preLoginCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "keel_session",
        "description": "Short-lived unauthenticated CSRF context returned by authCSRF; consumed and rotated by successful local login."
      },
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "keel_session",
        "description": "Random opaque server-side session; HttpOnly, SameSite=Lax, Path=/, and Secure outside explicit loopback HTTP development."
      }
    },
    "parameters": {
      "Origin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uri"
        },
        "description": "Exact origin from the configured allowlist; no wildcard, suffix, or request-Host-derived trust."
      },
      "CSRFToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Bound to the current pre-login or authenticated session; retained in application memory only."
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "description": "Reuse for a retry of the exact same account, operation and payload; use a new key for a new action."
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 1000000,
          "default": 1
        }
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      }
    },
    "responses": {
      "InvalidRequest": {
        "description": "Invalid JSON, unsupported fields, validation failure, or missing idempotency key.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unauthenticated": {
        "description": "Missing, invalid, expired or revoked session; on login, a uniform account or credential failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Origin or CSRF rejected, or the account does not have the required action permission.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NotFound": {
        "description": "The requested project is not visible to this account; used for both absent and unauthorized IDs.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflict": {
        "description": "Version conflict, duplicate username/membership/project slug, idempotency content mismatch, or removal of the last active platform/project administrator.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "UnsupportedMediaType": {
        "description": "Request Content-Type must be application/json.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "TooLarge": {
        "description": "JSON request exceeds 64 KiB.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "RateLimited": {
        "description": "Account or source throttled. The default failure policy is 5 failed attempts within 15 minutes.",
        "headers": {
          "Retry-After": {
            "schema": {
              "type": "integer",
              "minimum": 1
            },
            "description": "Minimum seconds before retrying."
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unavailable": {
        "description": "Authentication is not configured or initialized, or an essential service is unavailable. No authenticated session is issued on failure.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "FlowInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "string",
              "number",
              "boolean",
              "enum"
            ]
          },
          "required": {
            "type": "boolean"
          },
          "default": {
            "oneOf": [
              {
                "type": "string",
                "maxLength": 4096
              },
              {
                "type": "number"
              },
              {
                "type": "boolean"
              }
            ]
          },
          "enum": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 64
          }
        },
        "required": [
          "type",
          "required"
        ]
      },
      "SimTaskOptions": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "outcome": {
            "type": "string",
            "enum": [
              "success",
              "failed",
              "drop_receipt"
            ]
          },
          "duration_ms": {
            "type": "integer",
            "minimum": 0,
            "maximum": 60000
          },
          "fail_first": {
            "type": "integer",
            "minimum": 0,
            "maximum": 4,
            "default": 0
          },
          "seed": {
            "type": "integer",
            "format": "int64"
          },
          "uncancellable": {
            "type": "boolean",
            "default": false
          }
        },
        "required": [
          "outcome",
          "duration_ms",
          "seed"
        ]
      },
      "FlowTask": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
