      operationId: downloadMediaArtifact
      tags: [Media]
      x-permission: media:read
      x-scope: project
      security: [{sessionCookie: []}]
      description: Authenticated project members read only approved, non-retired media. The complete pinned object is verified before serving bytes; Range and If-Range are supported. Every authorized download is audited. No object-store URL or credentials are exposed.
      parameters:
        - name: Range
          in: header
          schema: {type: string}
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Verified approved bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206': {description: Verified byte range}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '416': {description: Requested range is not satisfiable}
        '422': {description: Stored object integrity verification failed; no bytes served}
        '503': {description: Pinned object or storage unavailable}
