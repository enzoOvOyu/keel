openapi: 3.1.0
info:
  title: keel API
  version: 0.4.0
  description: 'P1 foundation contracts for local authentication, revocable server sessions,

    and authorized projects. LDAP/OIDC adapters, templates, delivery execution,

    and the remaining business modules are pending; business_ready stays false.

    Every JSON request is limited to 64 KiB and rejects unknown properties.

    Responses never include password hashes, opaque cookie values, or infrastructure secrets.

    State-changing browser requests require an exact configured Origin and a

    session-bound X-CSRF-Token. Local HTTP is restricted to explicit loopback development.


    Identity, scoped membership, account recovery and redacted audit pagination are implemented in this increment. All versioned updates reject stale versions and preserve the last active platform/project administrator.

    '
tags:
- name: Foundation
- name: Authentication
- name: Projects
- name: Identity
- name: Members
- name: Audit
- name: BOM
paths:
  /healthz:
    get:
      tags:
      - Foundation
      operationId: health
      security: []
      responses:
        '200':
          description: Process liveness only; does not assert database or business readiness.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - service
                - version
                - scope
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: keel
                  version:
                    type: string
                  scope:
                    type: string
                    const: process
    head:
      tags:
      - Foundation
      operationId: healthHead
      security: []
      responses:
        '200':
          description: Process is alive; no response body.
  /api/v1:
    get:
      tags:
      - Foundation
      operationId: foundationInfo
      security: []
      responses:
        '200':
          description: Version and explicit foundation readiness.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - name
                - version
                - phase
                - authentication
                - business_ready
                properties:
                  name:
                    type: string
                    const: keel
                  version:
                    type: string
                  phase:
                    type: string
                    const: p1-foundation
                  authentication:
                    $ref: '#/components/schemas/AuthStatus'
                  business_ready:
                    type: boolean
                    const: false
  /api/v1/models:
    get:
      operationId: listDeviceModels
      tags: [Foundation]
      x-permission: model:read
      x-scope: platform
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Device model identities with their latest published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{id}/models:
    get:
      operationId: listProjectDeviceModels
      tags: [Foundation]
      x-permission: model:read
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Project-scoped and global models
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createDeviceModel
      tags: [Foundation]
      x-permission: model:manage
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceModelInput' }
      responses:
        '201':
          description: Created model identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{id}/models/{modelId}/versions:
    get:
      operationId: listDeviceModelVersions
      tags: [Foundation]
      x-permission: model:read
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: modelId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Immutable published version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelVersionPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: publishDeviceModelVersion
      tags: [Foundation]
      x-permission: model:manage
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: modelId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishModelVersionInput' }
      responses:
        '201':
          description: Published immutable version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelVersionDetail' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/projects/{id}/models/{modelId}/retire:
    post:
      operationId: retireDeviceModel
      tags: [Foundation]
      x-permission: model:manage
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: modelId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Retired model identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/projects/{id}/media:
    get:
      operationId: listProjectMedia
      tags: [Foundation]
      x-permission: model:read
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Registered media with lifecycle state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: registerMedia
      tags: [Foundation]
      x-permission: model:manage
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMediaInput' }
      responses:
        '201':
          description: Registered media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItemSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{id}/media/{mediaId}/transition:
    post:
      operationId: transitionMedia
      tags: [Foundation]
      x-permission: model:manage
      x-scope: project
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [verified, approved, retired] }
      responses:
        '200':
          description: Updated media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItemSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/providers:
    get:
      tags:
      - Authentication
      operationId: authProviders
      security: []
      description: Public availability only; no user, project, credentials, or internal provider addresses.
      responses:
        '200':
          description: Only configured and initialized methods are offered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - methods
                - environment
                properties:
                  status:
                    $ref: '#/components/schemas/AuthStatus'
                  methods:
                    type: array
                    uniqueItems: true
                    maxItems: 1
                    items:
                      type: string
                      enum:
                      - local
                    description: Contains local when ready; otherwise empty. Federated methods are not implemented in this increment.
                  environment:
                    type: string
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/csrf:
    get:
      tags:
      - Authentication
      operationId: authCSRF
      security: []
      description: Returns CSRF context for an existing valid session, or creates a short-lived pre-login cookie. Responses must not be cached.
      responses:
        '200':
          description: Pre-login CSRF context; cookie uses HttpOnly and SameSite=Lax, plus Secure outside explicit loopback HTTP development.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Opaque pre-login cookie; never persisted in browser storage by frontend code.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrf_token
                - expires_at
                properties:
                  csrf_token:
                    type: string
                    minLength: 1
                  expires_at:
                    type: string
                    format: date-time
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: authLogin
      security:
      - preLoginCookie: []
      description: 'Requires the pre-login cookie and its CSRF token. Success consumes that

        context and rotates the session identity. Unknown accounts, wrong passwords,

        and disabled accounts use the same public credential failure response.

        Account/source throttling is server-side; there is no public registration or default account.

        '
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded; a new opaque session cookie replaces the pre-login context.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly; SameSite=Lax; Path=/; Secure outside explicit loopback HTTP development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already authenticated; sign out before changing accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/session:
    get:
      tags:
      - Authentication
      operationId: authSession
      security:
      - sessionCookie: []
      description: 'Returns the current active account, current authorization, visible projects,

        CSRF token and effective expiry. Checks account and authorization on each request.

        Defaults are 30-minute idle and 12-hour absolute lifetime.

        '
      responses:
        '200':
          description: Current authenticated session; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: authLogout
      security:
      - sessionCookie: []
      description: Revokes the server-side session and expires the cookie. Frontend clears user/project caches and subscriptions; the prior session cannot be replayed.
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked; no response body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      security:
      - sessionCookie: []
      x-permission: project:read
      x-resource-scope: authorized-projects
      description: Paginated projects visible to the authenticated account. The items field is retained for existing clients.
      responses:
        '200':
          description: Authorized project summaries; an account with no projects receives an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    post:
      tags:
      - Projects
      operationId: createProject
      security:
      - sessionCookie: []
      x-permission: project:create
      x-resource-scope: platform-admin
      description: 'Platform Admin only in this increment. Atomically creates a planning

        project, its creator membership, audit record and idempotency result.

        Idempotency-Key is scoped to account and operation; reusing it with a

        different request payload is rejected. No template or gate progress is fabricated.

        '
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created, or original create result returned for an identical idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/projects/{id}:
    get:
      tags:
      - Projects
      operationId: getProject
      security:
      - sessionCookie: []
      x-permission: project:read
      x-resource-scope: path-project-id
      description: Revalidates membership and project scope on every request. Nonexistent and unauthorized IDs both return 404 to avoid existence disclosure.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/users:
    get:
      tags:
      - Identity
      operationId: listUsers
      security:
      - sessionCookie: []
      x-permission: user:read
      x-resource-scope: platform-admin
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 128
        description: Literal case-insensitive substring of username or display name.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized, paginated and redacted results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Identity
      operationId: createUser
      security:
      - sessionCookie: []
      x-permission: user:manage
      x-resource-scope: platform-admin
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Change committed and audited. Affected sessions are immediately invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/users/{userId}:
    patch:
      tags:
      - Identity
      operationId: updateUser
      security:
      - sessionCookie: []
      x-permission: user:manage
      x-resource-scope: platform-admin
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Change committed and audited. Affected sessions are immediately invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/users/{userId}/password:
    post:
      tags:
      - Identity
      operationId: resetUserPassword
      security:
      - sessionCookie: []
      x-permission: user:manage
      x-resource-scope: platform-admin
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Change committed and audited. Affected sessions are immediately invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/users/{userId}/unlock:
    post:
      tags:
      - Identity
      operationId: unlockUser
      security:
      - sessionCookie: []
      x-permission: user:manage
      x-resource-scope: platform-admin
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockUserRequest'
      responses:
        '200':
          description: Change committed and audited. Affected sessions are immediately invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
