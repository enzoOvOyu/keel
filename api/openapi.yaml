  /api/v1/projects/{id}/ztp/replacements/{replacementId}/reject: {"post": {"operationId": "rejectZTPReplacement", "description": "Project administrator rejects an exact pending request without changing bindings or credentials. Approved retirement cannot be undone through rejection. Permits a new reviewed request after BOM correction.", "tags": ["ZTP"], "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/EntityID"}}, {"name": "Origin", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "replacementId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/EntityID"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ZTPReplacementApproval"}}}}, "responses": {"400": {"description": "Invalid declaration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "401": {"description": "Authentication required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "Current project permission required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "404": {"description": "Project session not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Session state, mode, order or predecessor conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "200": {"description": "Project scoped identity lineage", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ZTPReplacement"}}}}}}}
  /api/v1/projects/{id}/ztp/identity-history: {"get": {"operationId": "listZTPIdentityHistory", "tags": ["ZTP"], "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/EntityID"}}], "responses": {"200": {"description": "Project scoped identity lineage", "content": {"application/json": {"schema": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/ZTPIdentityHistory"}}}}}, "400": {"description": "Invalid declaration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "401": {"description": "Authentication required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "Current project permission required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "404": {"description": "Project session not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Session state, mode, order or predecessor conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}, "post": {"operationId": "recordZTPIdentityHistory", "description": "Declare lineage between two completed, chronologically ordered sessions in the same project/mode. Reinstall preserves physical identity; RMA links distinct BOM identities. No identity rewrite, credential transfer or device mutation. Identical same-author requests return the original declaration; a target session has only one immutable predecessor.", "tags": ["ZTP"], "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/EntityID"}}, {"name": "Origin", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ZTPIdentityHistoryInput"}}}}, "responses": {"201": {"description": "Project scoped identity lineage", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ZTPIdentityHistory"}}}}, "400": {"description": "Invalid declaration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "401": {"description": "Authentication required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "Current project permission required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "404": {"description": "Project session not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Session state, mode, order or predecessor conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}
