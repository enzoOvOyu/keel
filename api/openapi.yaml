      required: [algorithm, payload, signature]
      properties:
        algorithm: { type: string, const: ed25519 }
        signature: { type: string, contentEncoding: base64, description: Ed25519 signature over the domain-separated compact Go encoding of the typed payload; verify with keel-admin and an independent trusted PKIX key. }
