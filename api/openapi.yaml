        '409': {description: Sign out before switching accounts.}
        '429': {description: Too many authentication requests.}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/oidc/{provider}/callback:
    get:
      tags: [Authentication]
      operationId: completeOIDC
      security: []
      description: One-use state and browser binding, code exchange with PKCE, signed issuer/audience/expiry/nonce verification and exact subject binding. Rotates the existing server session; no token is sent to the frontend.
      parameters:
      - {name: provider, in: path, required: true, schema: {type: string}}
      - {name: state, in: query, schema: {type: string}}
      - {name: code, in: query, schema: {type: string}}
      responses:
        '303': {description: Generic result at /auth/callback; secrets never included.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/csrf:
    get:
      tags:
      - Authentication
      operationId: authCSRF
      security: []
      description: Returns CSRF context for an existing valid session, or creates a short-lived pre-login cookie. Responses must not be cached.
      responses:
        '200':
          description: Pre-login CSRF context; cookie uses HttpOnly and SameSite=Lax, plus Secure outside explicit loopback HTTP development.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Opaque pre-login cookie; never persisted in browser storage by frontend code.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrf_token
                - expires_at
                properties:
                  csrf_token:
                    type: string
                    minLength: 1
                  expires_at:
                    type: string
                    format: date-time
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: authLogin
      security:
      - preLoginCookie: []
      description: 'Requires the pre-login cookie and its CSRF token. Success consumes that

        context and rotates the session identity. Unknown accounts, wrong passwords,

        and disabled accounts use the same public credential failure response.

        Account/source throttling is server-side; there is no public registration or default account.

        '
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded; a new opaque session cookie replaces the pre-login context.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly; SameSite=Lax; Path=/; Secure outside explicit loopback HTTP development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
