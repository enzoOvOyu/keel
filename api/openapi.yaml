        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_hash, decision, comment]
              properties:
                review_hash: { type: string }
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Frozen plan signature or rejection; NE plus DE, with NH for Critical changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPushJob' }

  /api/v1/projects/{id}/fabric/push-jobs/{jobId}/prepare:
    post:
      operationId: prepareNetworkPushJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: Domain-owned shared Execution, linked by its id; no separate queue.
          content:
            application/json:
              schema:
                type: object
                required: [id, mode]
                properties:
                  id: { type: string }
                  mode: { type: string, enum: [fabric] }

  /api/v1/projects/{id}/fabric/push-jobs/{jobId}/push:
    post:
      operationId: pushNetworkPushJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: Domain-owned shared Execution, linked by its id; no separate queue.
          content:
            application/json:
              schema:
                type: object
                required: [id, mode]
                properties:
                  id: { type: string }
                  mode: { type: string, enum: [fabric] }

  /api/v1/projects/{id}/fabric/push-jobs/{jobId}/archive:
    post:
      operationId: archiveNetworkPushJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Archive a terminal job; approvals, evidence and events retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPushJob' }

components:

  securitySchemes:
    preLoginCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Short-lived unauthenticated CSRF context returned by authCSRF; consumed and rotated by successful local login.
    sessionCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Random opaque server-side session; HttpOnly, SameSite=Lax, Path=/, and Secure outside explicit loopback HTTP development.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Exact origin from the configured allowlist; no wildcard, suffix, or request-Host-derived trust.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Bound to the current pre-login or authenticated session; retained in application memory only.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Reuse for a retry of the exact same account, operation and payload; use a new key for a new action.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:

    NetworkPushInput:
      type: object
      required: [template_id, baseline_ref, batch_ref]
      properties:
        template_id: { type: string }
        baseline_ref: { type: string }
        batch_ref: { type: string }
    NetworkPushJob:
      type: object
      required: [id, project_id, template_id, baseline_id, input, facts_hash, config_hash, state, review_hash, critical, canary_min_size, concurrency, prepare_execution_id, push_execution_id, created_by, created_at, devices, signatures]
      properties:
        id: { type: string }
        project_id: { type: string }
        template_id: { type: string }
        baseline_id: { type: string }
        input: { $ref: '#/components/schemas/NetworkPushInput' }
        facts_hash: { type: string }
        config_hash: { type: string }
        state: { type: string, enum: [CREATED, PRECHECKING, BLOCKED, READY, APPROVED, REJECTED, EXECUTING, VERIFYING, COMPLETED, PARTIAL, ROLLING_BACK, ROLLED_BACK, ARCHIVED] }
        review_hash: { type: string }
        critical: { type: boolean }
        canary_min_size: { type: integer }
        concurrency: { type: integer }
        prepare_execution_id: { type: string }
        push_execution_id: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        signatures:
          type: array
          items:
            type: object
            required: [user_id, role, review_hash, comment]
            properties:
              user_id: { type: string }
              role: { type: string, enum: [NE, DE, NH] }
              review_hash: { type: string }
              comment: { type: string }
        devices:
          type: array
          items:
            type: object
            required: [device, state, running_hash, snapshot_ref, diff, code, ordinal]
            properties:
              device: { $ref: '#/components/schemas/NetworkPlannedDevice' }
              state: { type: string, enum: [PENDING, PREPARED, BLOCKED, APPLYING, VERIFIED, PARTIAL, ROLLED_BACK, UNKNOWN, PAUSED, SKIPPED] }
              running_hash: { type: string }
              snapshot_ref: { type: string }
              code: { type: string }
              ordinal: { type: integer }
              prepare: { $ref: '#/components/schemas/NetworkOperationResult' }
              apply: { $ref: '#/components/schemas/NetworkOperationResult' }
              verify: { $ref: '#/components/schemas/NetworkOperationResult' }
              diff:
                type: array
                items:
                  type: object
                  required: [path, severity, before, after, before_present, after_present]
                  properties:
                    path: { type: string }
                    severity: { type: string, enum: [Critical, Major, Minor] }
                    before: {}
                    after: {}
                    before_present: { type: boolean }
                    after_present: { type: boolean }

    NetworkTemplateDefinition:
      type: object
      required: [source, variables]
      properties:
        source: { type: string, maxLength: 65536 }
        variables:
          type: object
          additionalProperties:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [string, number, integer, boolean, array, object] }
              required: { type: boolean }
              enum: { type: array, items: { type: string } }
    NetworkTemplateInput:
      type: object
      required: [name, source_ref, definition]
      properties:
        name: { type: string, maxLength: 120 }
        source_ref: { type: string, maxLength: 300 }
        definition: { $ref: '#/components/schemas/NetworkTemplateDefinition' }
    NetworkTemplateVersion:
      type: object
      required: [id, project_id, name, version, state, source_ref, definition, content_hash, created_by, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        version: { type: integer }
        state: { type: string, enum: [draft, tested, released, deprecated] }
        source_ref: { type: string }
        definition: { $ref: '#/components/schemas/NetworkTemplateDefinition' }
        content_hash: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        test_report: { $ref: '#/components/schemas/NetworkTemplateReport' }
    NetworkPlannedDevice:
      type: object
      required: [intended_id, id, serial, hostname, management_ip, model_version_id, credential_batch_ref, intended_hash]
      properties:
        approved_variables: { type: object, additionalProperties: true }
        intended_id: { type: string }
        id: { type: string }
        serial: { type: string }
        hostname: { type: string }
        management_ip: { type: string }
        model_version_id: { type: string }
        credential_batch_ref: { type: string }
        intended_hash: { type: string }
    NetworkTemplateReport:
      type: object
      required: [id, baseline_id, baseline_ref, batch_ref, facts_hash, config_hash, evidence_source, checked_at, devices, checks]
      properties:
        id: { type: string }
        baseline_id: { type: string }
        baseline_ref: { type: string }
        batch_ref: { type: string }
        facts_hash: { type: string }
        config_hash: { type: string }
        evidence_source: { type: string, enum: [device, protocol_fixture] }
        checked_at: { type: string, format: date-time }
        devices: { type: array, items: { $ref: '#/components/schemas/NetworkPlannedDevice' } }
        checks: { type: array, items: { $ref: '#/components/schemas/NetworkOperationResult' } }
    NetworkOperationResult:
      type: object
      required: [version, operation_id, project_id, device_id, serial, input_sha256, fencing_token, state, code, evidence_source, provider, observed_at, gates, exit_code, duration_ms]
      properties:
        version: { type: string, enum: [network-operation/v1] }
        operation_id: { type: string }
        project_id: { type: string }
        device_id: { type: string }
        serial: { type: string }
        input_sha256: { type: string }
        fencing_token: { type: integer }
        state: { type: string, enum: [completed, rejected] }
        code: { type: string }
        evidence_source: { type: string, enum: [device, protocol_fixture] }
        provider: { type: string }
        observed_at: { type: string, format: date-time }
        running: { type: object, additionalProperties: true }
        running_hash: { type: string }
        snapshot_ref: { type: string }
        exit_code: { type: integer }
        duration_ms: { type: integer }
        gates:
          type: array
          items:
            type: object
            required: [id, state, location, code, evidence_sha256]
            properties:
              id: { type: string }
              state: { type: string, enum: [PASS, WARN, FAIL, UNKNOWN] }
              location: { type: string }
              code: { type: string }
              evidence_sha256: { type: string }

    FabricDeviceSummary:
      type: object
      required: [id, serial, hostname, pod, role, rack, management_ip, state, nos, port_count, capabilities]
      properties:
        id: { type: string }
        serial: { type: string }
        hostname: { type: string }
        pod: { type: string }
        role: { type: string }
        rack: { type: string }
        management_ip: { type: string }
        state: { type: string, enum: [observed, unknown] }
        code: { type: string }
        nos: { type: string }
        port_count: { type: integer }
        collected_at: { type: string, format: date-time }
        content_hash: { type: string }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    FabricCollectionReport:
      type: object
      nullable: true
      required: [package_id, source_hash, evidence_source, stage, np3, stale, collected_at, valid_until, devices, findings]
      properties:
        id: { type: string }
        package_id: { type: string }
        source_hash: { type: string }
        evidence_source: { type: string, enum: [device, protocol_fixture] }
        stage: { type: string, enum: [N-S5] }
        np3: { type: string, enum: [BLOCKED] }
        stale: { type: boolean }
        collected_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        devices:
          type: array
          items: { $ref: '#/components/schemas/FabricDeviceSummary' }
        findings:
          type: array
          items:
            type: object
            required: [cable_uid, endpoint_a_uid, endpoint_b_uid, verdict, reason, source, rule_ref]
            properties:
              cable_uid: { type: string }
              endpoint_a_uid: { type: string }
              endpoint_b_uid: { type: string }
              verdict: { type: string, enum: [pending, anomaly, precheck_pass] }
              issue_type: { type: string }
              reason: { type: string }
              source: { type: string, enum: [switch] }
              rule_ref: { type: string }
    FabricOpticsData:
      type: object
      nullable: true
      required: [vendor, model, serial, media_type, rx_dbm, tx_dbm, temperature_c, voltage_v, bias_ma, supported]
      properties:
        vendor: { type: string }
        model: { type: string }
        serial: { type: string }
        media_type: { type: string }
        rx_dbm: { type: number, nullable: true }
        tx_dbm: { type: number, nullable: true }
        temperature_c: { type: number, nullable: true }
        voltage_v: { type: number, nullable: true }
        bias_ma: { type: number, nullable: true }
        supported: { type: boolean, nullable: true }
    FabricSwitchSnapshot:
      type: object
      required: [version, source, provider, serial, nos, collected_at, capabilities, ports, fdb, arp, bgp_up, ptp_locked]
      properties:
        version: { type: string, enum: [fabric-snapshot/v1] }
        source: { type: string, enum: [switch] }
        provider: { type: string }
        serial: { type: string }
        nos: { type: string }
        collected_at: { type: string, format: date-time }
        capabilities: { type: object, additionalProperties: { type: boolean } }
        bgp_up: { type: boolean, nullable: true }
        ptp_locked: { type: boolean, nullable: true }
        ports:
          type: array
          items:
            type: object
            required: [name, link_up, lldp_readable, neighbor, speed_mbps, mtu, crc, flaps, optics, metrics]
            properties:
              name: { type: string }
              link_up: { type: boolean, nullable: true }
              lldp_readable: { type: boolean }
              speed_mbps: { type: integer, nullable: true }
              mtu: { type: integer, nullable: true }
              crc: { type: integer, nullable: true }
              flaps: { type: integer, nullable: true }
              metrics: { type: object, nullable: true, additionalProperties: { type: number } }
              optics: { $ref: '#/components/schemas/FabricOpticsData' }
              neighbor:
                type: object
                nullable: true
                required: [chassis_id, port_id, sysname, sysdesc]
                properties:
                  chassis_id: { type: string }
                  port_id: { type: string }
                  sysname: { type: string }
                  sysdesc: { type: string }
                  serial: { type: string }
        fdb:
          type: array
          nullable: true
          items:
            type: object
            required: [mac, port, vlan]
            properties:
              mac: { type: string }
              port: { type: string }
              vlan: { type: integer }
        arp:
          type: array
          nullable: true
          items:
            type: object
            required: [address, mac, port]
            properties:
              address: { type: string }
              mac: { type: string }
              port: { type: string }
    FabricDeviceEvidence:
      type: object
      required: [run_id, content_hash, stale, evidence_source, snapshot, optics]
      properties:
        run_id: { type: string }
        content_hash: { type: string }
        stale: { type: boolean }
        evidence_source: { type: string, enum: [device, protocol_fixture] }
        snapshot: { $ref: '#/components/schemas/FabricSwitchSnapshot' }
        optics:
          type: array
          items:
            type: object
            required: [port, data, state, reasons, source, rule_ref]
            properties:
              port: { type: string }
              data: { $ref: '#/components/schemas/FabricOpticsData' }
              state: { type: string, enum: [normal, warning, critical, unknown] }
              reasons: { type: array, items: { type: string } }
              source: { type: string, enum: [switch] }
              rule_ref: { type: string }
    ZTPIsolationScriptManifest:
      type: object
      required: [type, version, sha256, size, os_scope, script]
      properties:
        type: { type: string, enum: [ztp_script] }
        version: { type: string, enum: [isolation-v1] }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        os_scope: { type: string }
        script: { type: string }
    ZTPMockKeaOptions:
      type: object
      required: [batch_ref, stage_ref, management_cidr, option_239_url, option_143_uris, option_60_vci, option_43]
      properties:
        batch_ref: { type: string, maxLength: 160 }
        stage_ref: { type: string, maxLength: 160 }
        management_cidr: { type: string }
        option_239_url: { type: string, format: uri }
        option_143_uris:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string, format: uri }
        option_60_vci: { type: string }
        option_43:
          type: object
          required: [nos, version_intent]
          properties:
            nos: { type: string }
            version_intent: { type: string }
    ZTPMockKeaPlan:
      type: object
      required: [batch_ref, stage_ref, version, updated_at]
      properties:
        batch_ref: { type: string }
        stage_ref: { type: string }
        staged_hash: { type: string }
        active_hash: { type: string }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    ZTPMockKeaDeactivateInput:
      type: object
      additionalProperties: false
      required: [batch_ref, stage_ref, active_hash, expected_version, reason]
      properties:
        batch_ref: { type: string, minLength: 1, maxLength: 160 }
        stage_ref: { type: string, minLength: 1, maxLength: 160 }
        active_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 300 }
    ZTPMockKeaCommitInput:
      type: object
      required: [batch_ref, stage_ref, staged_hash, expected_version]
      properties:
        batch_ref: { type: string }
        stage_ref: { type: string }
        staged_hash: { type: string }
        expected_version: { type: integer, format: int64 }
    ZTPDORARequest:
      type: object
      required: [batch_ref, stage_ref, interface, link_ip, vendor_class]
      properties:
        batch_ref: { type: string }
        stage_ref: { type: string }
        interface: { type: string }
        link_ip: { type: string, format: ipv4 }
        vendor_class: { type: string }
    ZTPDORAResult:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [ack, no_offer] }
        reason: { type: string }
        config_hash: { type: string }
        option_239_url: { type: string }
        option_143_uris:
          type: array
          items: { type: string }
        option_60_vci: { type: string }
        option_43:
          type: object
          additionalProperties: { type: string }
    ZTPSessionSummary:
      type: object
      required: [id, batch_ref, boot_channel, state, state_version, attempt, identity_verdict, updated_at]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        batch_ref: { type: string }
        boot_channel: { type: string }
        state: { type: string }
        state_version: { type: integer, format: int64 }
        attempt: { type: integer }
        identity_verdict: { type: string }
        updated_at: { type: string, format: date-time }
    ZTPCredentialIssue:
      type: object
      additionalProperties: false
      required: [id, session_id, switch_id, credential_batch_ref, verdict, attempt, occurred_at]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        session_id: { $ref: '#/components/schemas/EntityID' }
        switch_id: { $ref: '#/components/schemas/EntityID' }
        credential_batch_ref: { type: string }
        verdict: { type: string, enum: [expired, unreachable, unregistered] }
        attempt: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time }
    ZTPIdentityIssueResolveInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 300 }
    ZTPIdentityIssue:
      type: object
      additionalProperties: false
      required: [id, batch_ref, boot_channel, identity_key, serial_number, reasons, event_count, state, first_seen_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        batch_ref: { type: string }
        boot_channel: { type: string, enum: ['239', '143', sim] }
        identity_key: { type: string }
        serial_number: { type: string }
        source_ip: { type: string }
        reasons:
          type: array
          items: { type: string }
        event_count: { type: integer, minimum: 1 }
        state: { type: string, enum: [open, resolved] }
        resolution_reason: { type: string }
        resolved_at: { type: string, format: date-time }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    ZTPDeviceObservation:
      type: object
      additionalProperties: false
      required: [id, batch_ref, serial_number, source_ip, boot_channel, event_type, offer_hash, trace_id, occurred_at]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        batch_ref: { type: string }
        switch_id: { $ref: '#/components/schemas/EntityID' }
        serial_number: { type: string }
        source_ip: { type: string }
        boot_channel: { type: string, enum: ['143', '239'] }
        event_type: { type: string, enum: [data-served, report] }
        progress_type: { type: string }
        message: { type: string, maxLength: 1000 }
        offer_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        evidence_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        trace_id: { type: string }
        occurred_at: { type: string, format: date-time }
    ZTPSimSessionInput:
      type: object
      additionalProperties: false
      required: [batch_ref, boot_channel, identity]
      properties:
        batch_ref: { type: string, minLength: 1, maxLength: 160 }
        boot_channel: { type: string, enum: ['239', '143', '60-43'] }
        identity: { $ref: '#/components/schemas/ZTPIdentityInput' }
    ZTPSimRunInput:
      type: object
      additionalProperties: false
      required: [expected_version, dora]
      properties:
        expected_version: { type: integer, minimum: 1 }
        dora: { $ref: '#/components/schemas/ZTPDORARequest' }
        credential_verdict: { type: string, enum: [reachable, expired, unreachable], description: Operator supplied simulation fixture for a registered switch credential batch. }
    ZTPSessionAction:
      type: object
      additionalProperties: false
      required: [action, expected_version]
      properties:
        action: { type: string, enum: [advance, fail, retry] }
        expected_version: { type: integer, minimum: 1 }
        dora: { $ref: '#/components/schemas/ZTPDORARequest' }
        evidence_ref: { type: string, maxLength: 300 }
        credential_verdict: { type: string, enum: [reachable, expired, unreachable], description: Operator supplied simulation fixture for a registered switch credential batch at the managed transition. }
        phenomenon: { type: string, maxLength: 1000 }
        cause: { type: string, maxLength: 1000 }
        next_action: { type: string, maxLength: 1000 }
    ZTPSessionEvent:
      type: object
      additionalProperties: false
      required: [seq, to_state, event_code, attempt, occurred_at]
      properties:
        seq: { type: integer, minimum: 1 }
        from_state: { type: string }
        to_state: { type: string }
        event_code: { type: string }
        evidence_ref: { type: string }
        attempt: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time }
    ZTPSessionDetail:
      type: object
      additionalProperties: false
      required: [id, project_id, batch_ref, mode, boot_channel, state, state_version, attempt, retry_max, identity_resolution, started_at, updated_at, events]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        project_id: { $ref: '#/components/schemas/EntityID' }
        switch_id: { $ref: '#/components/schemas/EntityID' }
        batch_ref: { type: string }
        mode: { type: string, enum: [sim, device] }
        boot_channel: { type: string, enum: ['239', '143', '60-43'] }
        state: { type: string, enum: [powered, dhcp, booturl, identity, lookup, fetch, config, restart, managed, isolated, conflict, failed] }
        state_version: { type: integer, minimum: 1 }
        attempt: { type: integer, minimum: 1 }
        retry_max: { type: integer, minimum: 0, maximum: 10 }
        identity_resolution: { $ref: '#/components/schemas/ZTPIdentityResolution' }
        failure_phenomenon: { type: string }
        failure_cause: { type: string }
        failure_next_action: { type: string }
