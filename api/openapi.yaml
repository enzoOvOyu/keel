  /healthz:
    get:
      tags:
      - Foundation
      operationId: health
      security: []
      responses:
        '200':
          description: Process liveness only; does not assert database or business readiness.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - service
                - version
                - scope
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: keel
                  version:
                    type: string
                  scope:
                    type: string
                    const: process
    head:
      tags:
      - Foundation
      operationId: healthHead
      security: []
      responses:
        '200':
          description: Process is alive; no response body.
  /api/v1:
    get:
      tags:
      - Foundation
      operationId: foundationInfo
      security: []
      responses:
        '200':
          description: Version and explicit foundation readiness.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - name
                - version
                - phase
                - authentication
                - business_ready
                properties:
                  name:
                    type: string
                    const: keel
                  version:
                    type: string
                  phase:
                    type: string
                    const: p1-foundation
                  authentication:
                    $ref: '#/components/schemas/AuthStatus'
                  business_ready:
                    type: boolean
                    const: false
  /api/v1/models:
    get:
      operationId: listDeviceModels
      tags: [Foundation]
      x-permission: model:read
      x-scope: platform
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Device model identities with their latest published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{id}/assets:
    get:
      operationId: listProjectAssets
      tags: [BOM]
      x-permission: model:read
      x-resource-scope: path-project
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/EntityID' } }
