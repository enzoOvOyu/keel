  /api/v1/projects/{id}/provision/os-images/{mediaId}/dependencies: {"get": {"operationId": "getProvisionOSDependencies", "tags": ["Foundation"], "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-f0-9]{32}$"}}, {"name": "mediaId", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-f0-9]{32}$"}}], "description": "Current approved OS dependency metadata and registered driver compatibility matrix provenance. Metadata only: no image byte streaming, compatibility verdict, package installation or claim of preinstalled drivers. Actual provisioning separately checks full artifact integrity and admission.", "responses": {"200": {"description": "Approved immutable dependency relationships", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProvisionOSDependencies"}}}}, "400": {"$ref": "#/components/responses/InvalidRequest"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"description": "Invalid/unavailable dependency metadata"}}}}
