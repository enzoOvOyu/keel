                      - oidc
                      - ldap
                    description: Only configured methods are listed when initialized.
                  ldap_name:
                    type: string
                    maxLength: 80
                    description: Configured public directory label only; empty when disabled.
                  oidc_providers:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name]
                      properties:
                        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
