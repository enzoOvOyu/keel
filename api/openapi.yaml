openapi: 3.1.0
info:
  title: keel API
  version: 0.4.0
  description: 'P1 foundation contracts for local authentication, revocable server sessions,

    and authorized projects. LDAP/OIDC adapters, templates, delivery execution,

    and the remaining business modules are pending; business_ready stays false.

    Every JSON request is limited to 64 KiB and rejects unknown properties.

    Responses never include password hashes, opaque cookie values, or infrastructure secrets.

    State-changing browser requests require an exact configured Origin and a

    session-bound X-CSRF-Token. Local HTTP is restricted to explicit loopback development.


    Identity, scoped membership, account recovery and redacted audit pagination are implemented in this increment. All versioned updates reject stale versions and preserve the last active platform/project administrator.

    '
tags:
- name: Foundation
- name: Authentication
- name: Projects
- name: Identity
- name: Members
- name: Audit
- name: BOM
paths:
  /api/v1/projects/{id}/issues/targets: {"get": {"operationId": "listIssueTargets", "tags": ["Issues"], "security": [{"sessionCookie": []}], "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "q", "in": "query", "schema": {"type": "string", "maxLength": 120}}], "responses": {"200": {"description": "Up to50 authorized stable targets, searchable by label", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/IssueTarget"}}}}}, "400": {"$ref": "#/components/responses/InvalidRequest"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}
  /api/v1/issues: {"get": {"operationId": "listIssues", "tags": ["Issues"], "security": [{"sessionCookie": []}], "description": "Aggregate only projects currently authorized to the caller. Project is an optional filter; source is immutable discovery origin and responsibility is a separate filter.", "parameters": [{"name": "page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 1000000}}, {"name": "page_size", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100}}, {"name": "project_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "state", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "category", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "source", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "phase", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "responsible_domain", "in": "query", "required": false, "schema": {"type": "string"}}], "responses": {"200": {"description": "Current authorized result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IssuePage"}}}}, "400": {"$ref": "#/components/responses/InvalidRequest"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}
