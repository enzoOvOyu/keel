  /api/v1/projects/{id}/issues: {"post": {"operationId": "createIssue", "tags": ["Issues"], "security": [{"sessionCookie": []}], "description": "Create an operator-reported issue anchored to authorized stable objects. Project Admin/DL/NE only. Original source, phase and observation stay immutable. No mapping or G3 prerequisite; same key and content return the existing current record, changed content conflicts.", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[a-f0-9]{32}$"}}, {"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/Origin"}, {"$ref": "#/components/parameters/CSRFToken"}], "responses": {"201": {"description": "Current authorized result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Issue"}}}}, "400": {"$ref": "#/components/responses/InvalidRequest"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateIssueInput"}}}}}}
