      - name: batch
        in: query
        required: true
        schema: { type: string }
      - name: stage
        in: query
        required: true
        schema: { type: string, enum: [N-S4] }
      - name: policy
        in: query
        required: true
        schema: { $ref: '#/components/schemas/EntityID' }
      - name: CUMULUS-SERIAL
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      - name: CUMULUS-BASE-MAC
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      - name: CUMULUS-MGMT-MAC
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      - name: CUMULUS-PRODUCTNAME
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      - name: CUMULUS-VERSION
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      - name: CUMULUS-BUILD
        in: header
        required: true
        schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Approved fixed Cumulus isolation script; device remains outside production fabric.
          content:
            text/x-shellscript:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
