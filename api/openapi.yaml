components:

  securitySchemes:
    preLoginCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Short-lived unauthenticated CSRF context returned by authCSRF; consumed and rotated by successful local login.
    sessionCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Random opaque server-side session; HttpOnly, SameSite=Lax, Path=/, and Secure outside explicit loopback HTTP development.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Exact origin from the configured allowlist; no wildcard, suffix, or request-Host-derived trust.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Bound to the current pre-login or authenticated session; retained in application memory only.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Reuse for a retry of the exact same account, operation and payload; use a new key for a new action.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    CreateBOMMappingProfileInput:
      type: object
      additionalProperties: false
      required: [version_ref, server_columns, fabric_columns]
      properties:
        version_ref: { type: string, minLength: 1, maxLength: 120 }
        server_columns:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        fabric_columns:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
    BOMMappingProfile:
      type: object
      additionalProperties: false
      required: [id, project_id, version_ref, state, server_columns, fabric_columns, created_at]
      properties:
        id: { $ref: '#/components/schemas/EntityID' }
        project_id: { $ref: '#/components/schemas/EntityID' }
        version_ref: { type: string }
        state: { type: string, enum: [draft, approved, retired] }
        server_columns:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        fabric_columns:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
    MediaItemSummary:
      type: object
      additionalProperties: false
      required: [id, scope_key, type, name, version, sha256, size, arch, os_scope, hw_scope, deps, manifest_ref, state, uploaded_by, approved_by, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        scope_key: { type: string }
        type: { type: string, enum: [driver, firmware, os, nccl, tool, config] }
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: string, minLength: 1, maxLength: 120 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, format: int64, minimum: 0 }
        arch: { type: string, enum: [amd64, arm64, noarch] }
        os_scope: { type: string, maxLength: 120 }
        hw_scope: { type: string, maxLength: 120 }
        deps: {}
        manifest_ref: { type: string, maxLength: 200 }
        state: { type: string, enum: [uploaded, verified, approved, retired] }
        uploaded_by: { type: string }
        approved_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MediaItemSummary' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    RegisterMediaInput:
      type: object
      additionalProperties: false
      required: [type, name, version, sha256, size, arch]
      properties:
        type: { type: string, enum: [driver, firmware, os, nccl, tool, config] }
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: string, minLength: 1, maxLength: 120 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, format: int64, minimum: 0 }
        arch: { type: string, enum: [amd64, arm64, noarch] }
        os_scope: { type: string, maxLength: 120 }
        hw_scope: { type: string, maxLength: 120 }
        deps: { type: object, additionalProperties: true }
        manifest_ref: { type: string, maxLength: 200 }
    DeviceModelSummary:
      type: object
      additionalProperties: false
      required: [id, scope_key, name, kind, state, latest_version, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        scope_key: { type: string, enum: [global], description: 'Reserved for the platform scope; project scopes use project:<id>.' }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [rack, server, compute-tray, switch] }
        state: { type: string, enum: [active, retired] }
        latest_version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceModelPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeviceModelSummary' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    ModelSlot:
      type: object
      additionalProperties: false
      required: [slot_no, pcie_slot, expect_nic_model, panel_port, default_role]
      properties:
        slot_no: { type: integer, minimum: 1, maximum: 1024 }
        pcie_slot: { type: string, minLength: 1, maxLength: 64 }
        expect_nic_model: { type: string, minLength: 1, maxLength: 120 }
        panel_port: { type: string, minLength: 1, maxLength: 64 }
        default_role: { type: string, enum: [management, storage, compute, oob, unused] }
    CreateDeviceModelInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [rack, server, compute-tray, switch] }
    PublishModelVersionInput:
      type: object
      additionalProperties: false
      properties:
        hw_spec: { type: object, additionalProperties: true }
        expected_topology: { type: object, additionalProperties: true }
        capability_matrix: { type: object, additionalProperties: true }
        panel_layout: { type: object, additionalProperties: true }
        bom_expect: { type: object, additionalProperties: true }
        default_role_plan: { type: object, additionalProperties: true }
        slots:
          type: array
          items: { $ref: '#/components/schemas/ModelSlot' }
    DeviceModelVersionDetail:
      type: object
      additionalProperties: false
      required: [id, model_id, version, hw_spec, expected_topology, capability_matrix, panel_layout, bom_expect, default_role_plan, content_hash, published_at, slots]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{32}$' }
        model_id: { type: string, pattern: '^[a-f0-9]{32}$' }
        version: { type: integer, format: int64, minimum: 1 }
        hw_spec: {}
        expected_topology: {}
        capability_matrix: {}
        panel_layout: {}
        bom_expect: {}
        default_role_plan: {}
        content_hash: { type: string, minLength: 64, maxLength: 64 }
        published_at: { type: string, format: date-time }
        slots: { type: array, items: { $ref: '#/components/schemas/ModelSlot' } }
    DeviceModelVersionPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeviceModelVersionDetail' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    EntityID:
      type: string
      pattern: ^[a-f0-9]{32}$
      description: Opaque 128-bit identifier serialized as lowercase hexadecimal.
    AuthStatus:
      type: string
      enum:
      - ready
      - setup_required
      - not_configured
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      - method
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed and converted to lowercase; canonical account names use a-z, 0-9, dot, underscore and hyphen.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Maximum 1024 UTF-8 bytes; newly provisioned passwords require at least 12 bytes.
        method:
          type: string
          const: local
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        description:
          type: string
          maxLength: 2000
          default: ''
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - display_name
      - is_admin
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        username:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
    Session:
      type: object
      additionalProperties: false
      required:
      - user
      - permissions
      - projects
      - csrf_token
      - expires_at
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        csrf_token:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
    ProjectRole:
      type: string
      enum:
      - Admin
      - DE
      - DL
      - NE
      - SRE
      - Viewer
    ProjectState:
      type: string
      enum:
      - planning
      - deploying
      - verifying
      - delivered
      - archived
      description: FR-17 project lifecycle; this increment only creates planning projects and exposes no transitions.
    ProjectSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - description
      - state
      - role
      - created_at
      - updated_at
      - version
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        state:
          $ref: '#/components/schemas/ProjectState'
        role:
          $ref: '#/components/schemas/ProjectRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - details
      - trace_id
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        trace_id:
          type: string
          minLength: 1
    UserAccount:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - display_name
      - is_admin
      - enabled
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        username:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - display_name
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9._-]{0,127}$
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: 12..1024 UTF-8 bytes. Never returned or audited.
        is_admin:
          type: boolean
          default: false
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
      - enabled
      - version
      properties:
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - version
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: 12..1024 UTF-8 bytes. Never returned or audited.
        version:
          type: integer
          minimum: 1
    UnlockUserRequest:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
        ip:
          type: string
          description: Optional explicit source IP throttle; omitting it unlocks only the account.
    ChangeOwnPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: 12..1024 UTF-8 bytes. Never returned or audited.
    ProjectMember:
      type: object
      additionalProperties: false
      required:
      - id
      - user
      - enabled
      - role
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        user:
          $ref: '#/components/schemas/User'
        enabled:
          type: boolean
        role:
          $ref: '#/components/schemas/ProjectRole'
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - role
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9._-]{0,127}$
        role:
          $ref: '#/components/schemas/ProjectRole'
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required:
      - role
      - version
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
        version:
          type: integer
          minimum: 1
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - actor_id
      - actor_name
      - project_id
      - action
      - target_id
      - trace_id
      - metadata
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        actor_id:
          type:
          - string
          - 'null'
        actor_name:
          type:
          - string
          - 'null'
        project_id:
          type:
          - string
          - 'null'
        action:
          type: string
        target_id:
          type:
          - string
          - 'null'
        trace_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Allowlisted non-secret scalar metadata only; never passwords, hashes, token/cookie values or source IPs.
        created_at:
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    UserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccount'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    MemberPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
  responses:
    InvalidRequest:
      description: Invalid JSON, unsupported fields, validation failure, or missing idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing, invalid, expired or revoked session; on login, a uniform account or credential failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Origin or CSRF rejected, or the account does not have the required action permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested project is not visible to this account; used for both absent and unauthorized IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Version conflict, duplicate username/membership/project slug, idempotency content mismatch, or removal of the last active platform/project administrator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Request Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: JSON request exceeds 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Account or source throttled. The default failure policy is 5 failed attempts within 15 minutes.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Minimum seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication is not configured or initialized, or an essential service is unavailable. No authenticated session is issued on failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
