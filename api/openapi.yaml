          type: object
          minProperties: 1
          maxProperties: 32
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 256
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 120 }
        combinations:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: object
            minProperties: 1
            maxProperties: 32
            additionalProperties: { type: string, minLength: 1, maxLength: 120 }
