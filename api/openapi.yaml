entInput"}}}}, "responses": {"201": {"description": "Project scoped identity lineage", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ZTPReplacement"}}}}, "400": {"description": "Invalid declaration", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "401": {"description": "Authentication required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "Current project permission required", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "404": {"description": "Project session not found", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Session state, mode, order or predecessor conflict", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}
