components:

  securitySchemes:
    preLoginCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Short-lived unauthenticated CSRF context returned by authCSRF; consumed and rotated by successful local login.
    sessionCookie:
      type: apiKey
      in: cookie
      name: keel_session
      description: Random opaque server-side session; HttpOnly, SameSite=Lax, Path=/, and Secure outside explicit loopback HTTP development.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Exact origin from the configured allowlist; no wildcard, suffix, or request-Host-derived trust.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Bound to the current pre-login or authenticated session; retained in application memory only.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Reuse for a retry of the exact same account, operation and payload; use a new key for a new action.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    IssueTarget: {"type": "object", "additionalProperties": false, "required": ["kind", "id", "label"], "properties": {"kind": {"type": "string", "enum": ["machine", "component", "port", "switch", "cable"]}, "id": {"type": "string"}, "label": {"type": "string"}}}
