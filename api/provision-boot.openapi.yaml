          "sequence",
          "nonce",
          "stage",
          "storage_plan_sha256",
          "gpt_sha256",
          "checked_at",
          "valid_until"
        ],
        "properties": {
          "permit_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "installation_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "boot_id": {
