{
  "openapi": "3.1.0",
  "info": {
    "title": "Keel isolated boot callback protocol",
    "version": "0.1.0",
    "description": "Source contract, opt-in server wiring only. Tokens never occur in URL, public boot resources or logs. Acknowledgment does not project asset/SSH trust. No writer or listener is enabled by this contract."
  },
  "paths": {
    "/boot/{grantId}/enroll": {
      "post": {
        "operationId": "enrollInstallationBoot",
        "description": "Separate isolated HTTPS origin on an approved direct-peer boot scope; no session cookies, Origin, proxy identity or automatic retry. Canonical JSON only. Exact current attempt/command/fence/exclusive lease/source/scope revalidated in the proof-consumption transaction. No write permission or installation success. Single-use out-of-band bootstrap token binds the per-boot Ed25519 key.",
        "security": [
          {
            "bootBootstrap": []
          }
        ],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EnrollmentSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Proof consumed; this is not a write permit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Acknowledgment"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/preflight": {
      "post": {
        "operationId": "submitInstallationPreflight",
        "description": "Separate isolated HTTPS origin on an approved direct-peer boot scope; no session cookies, Origin, proxy identity or automatic retry. Canonical JSON only. Exact current attempt/command/fence/exclusive lease/source/scope revalidated in the proof-consumption transaction. No write permission or installation success. No Authorization header; enrolled key signs exact decoded report and next sequence. Initial report is sequence 2. Further collection requires an explicit current operator refresh request and its signed refresh_id; at most 32 reports, no report after disk selection. Rejected/lost acknowledgment must not be resent.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PreflightSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Proof consumed; this is not a write permit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Acknowledgment"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/review": {
      "post": {
        "operationId": "reviewInstallationStorage",
        "description": "Read-only signed status query with fresh random 128-bit nonce and last acknowledged report sequence. Nonce is echoed over fixed pinned TLS. Does not consume sequence, mutate business versions, collect facts, or grant writes. Exact current lease/source/role/scope/peer revalidated. A repeated read cannot authorize a mutation.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current pre-write storage review status; never a write permit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReviewStatus"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/write-permit": {
      "post": {
        "operationId": "issueInstallationWritePermit",
        "description": "One-shot transition from independently approved storage to installing. Exact next boot sequence, fresh recomputed report, reconstructed GPT, v2 target contract, current independently approved runtime inputs, exclusive lease, scope and reviewers are checked in one transaction. A lost response MUST NOT be retried. Permit expiration never replaces per-operation live checks.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WritePermitSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current authenticated response; no first-boot or SSH success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WritePermit"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/write-check": {
      "post": {
        "operationId": "checkInstallationWritePermit",
        "description": "Read-only nonce/stage-bound query signed at the acknowledged permit sequence. No callback sequence or business-version mutation. Validity is at most two seconds and bounded by the current exclusive lease and installation expiry. Writer must check immediately before each step and continuously during long actions; rejection or expired validity stops work with unknown outcome.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WriteCheckSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current authenticated response; no first-boot or SSH success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WriteAuthorization"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/write-receipt": {
      "post": {
        "operationId": "reportInstallationWriteReceipt",
        "description": "One-shot next sequence signed using operation install-stopped over canonical WriteReceipt JSON. written requires the exact expected WriteReadback commitment and moves only to awaiting_first_boot. unknown retains the exclusive resource. This callback proves neither actual first boot, SSH trust, nor controller-side observation of disk bytes; no automatic retry on loss.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WriteReceiptSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current authenticated response; no first-boot or SSH success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Acknowledgment"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    },
    "/boot/{grantId}/first-boot": {
      "post": {
        "operationId": "registerInstallationFirstBootIdentity",
        "description": "Separate per-first-boot Ed25519 key fixed in the original signed write preparation; signature domain is UTF-8 Keel provision first boot v1, NUL, canonical FirstBootReport JSON. One observation at sequence 1, different actual kernel boot ID, fresh host key and exact frozen host/disk identity. Current attempt/lease/source/roles/scope, matching permit-bound public binding and auxiliary DHCP fingerprint are checked. Acknowledgment records authenticated identity awaiting actual pinned SSH verification; no trust or registered/success state. No retry after lost ACK.",
        "security": [],
        "parameters": [
          {
            "name": "grantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/FirstBootSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authenticated identity persisted once; SSH verification still pending",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FirstBootAcknowledgment"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable, unauthorized, changed scope/lease or replay; no secret/detail returned"
          },
          "413": {
            "description": "Envelope too large"
          },
          "415": {
            "description": "application/json required"
          },
          "503": {
            "description": "Bounded callback capacity exhausted"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bootBootstrap": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "single-use 64 lowercase hexadecimal characters"
      }
    },
    "schemas": {
      "BootProof": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema",
          "installation_id",
          "boot_id",
          "sequence",
          "operation",
          "payload_sha256",
          "signature"
        ],
        "properties": {
          "schema": {
            "const": "keel.provision-boot-proof/v1"
          },
          "installation_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "boot_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sequence": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4096
          },
          "operation": {
            "type": "string",
            "enum": [
              "enroll",
              "preflight",
              "preflight-refresh",
              "review",
              "write-permit",
              "write-check",
              "install-stopped"
            ]
          },
          "payload_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "signature": {
            "type": "string",
            "contentEncoding": "base64"
          }
        }
      },
      "Enrollment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "installation_id",
          "boot_id",
          "public_key"
        ],
        "properties": {
          "installation_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "boot_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "public_key": {
            "type": "string",
            "contentEncoding": "base64"
          }
        }
      },
      "EnrollmentSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "enrollment",
          "proof"
        ],
        "properties": {
          "enrollment": {
            "$ref": "#/components/schemas/Enrollment"
          },
          "proof": {
            "$ref": "#/components/schemas/BootProof"
          }
        }
      },
      "PreflightSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "report",
          "proof"
        ],
        "properties": {
          "report": {
            "type": "string",
            "contentEncoding": "base64",
            "maxLength": 2796204,
            "description": "Exact helper stdout, decoded length 1..2097152. Signature binds decoded bytes; recomputed against frozen Spec."
          },
          "proof": {
            "$ref": "#/components/schemas/BootProof"
          },
          "refresh_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$",
            "description": "Required for later reports and must match the pending explicit request at the last acknowledged sequence. Signature operation preflight-refresh signs UTF-8 Keel preflight refresh v1 followed by NUL, refresh_id, NUL, and exact report bytes. Initial report signs raw report with operation preflight."
          }
        }
      },
      "Acknowledgment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "installation_id",
          "boot_id",
          "sequence",
          "state",
          "expires_at"
        ],
        "properties": {
          "installation_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "boot_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sequence": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4096
          },
          "state": {
            "type": "string",
            "enum": [
              "booting",
              "preflight_ready",
              "failed",
              "awaiting_first_boot",
              "unknown"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "reboot_before": {
            "type": "string",
            "format": "date-time",
            "description": "Only an acknowledged written receipt may authorize one immediate controlled reboot; expires within two seconds and before the current exclusive lease."
          }
        }
      },
      "ReviewQuery": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nonce"
        ],
        "properties": {
          "nonce": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        }
      },
      "ReviewSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "query",
          "proof"
        ],
        "properties": {
          "query": {
            "$ref": "#/components/schemas/ReviewQuery"
          },
          "proof": {
            "$ref": "#/components/schemas/BootProof"
          }
        }
      },
      "ReviewStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "installation_id",
          "boot_id",
          "sequence",
          "nonce",
          "state",
          "expires_at",
          "report_sha256"
        ],
        "properties": {
          "installation_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "boot_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sequence": {
            "type": "integer",
            "minimum": 2,
            "maximum": 33
          },
          "nonce": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "state": {
            "type": "string",
            "enum": [
              "preflight_ready",
              "awaiting_storage_review",
              "storage_approved"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "report_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "refresh_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "storage_plan_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "runtime_input_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "storage_plan": {
            "$ref": "./openapi.yaml#/components/schemas/ProvisionStoragePlan",
            "description": "Complete immutable approved disk plan, returned only for storage_approved. This is not a write permit."
          }
        }
      },
      "GPTIdentity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "disk_guid",
          "efi_partition_guid",
          "root_partition_guid"
        ],
        "properties": {
          "disk_guid": {
            "type": "string",
            "pattern": "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"
          },
          "efi_partition_guid": {
