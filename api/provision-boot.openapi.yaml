            "pattern": "^[a-f0-9]{32}$"
          },
          "storage_plan_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "gpt_identity": {
            "$ref": "#/components/schemas/GPTIdentity"
          },
          "gpt_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "rootfs_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "target_uki_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "runtime_input_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "first_boot_binding": {
            "$ref": "#/components/schemas/FirstBootBinding"
          }
        }
      },
      "WritePermitSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "preparation",
          "report",
          "proof"
        ],
        "properties": {
          "preparation": {
            "$ref": "#/components/schemas/WritePreparation"
          },
          "report": {
            "type": "string",
            "contentEncoding": "base64",
            "description": "Exact bounded fresh helper stdout. write-permit signs UTF-8 Keel installation write preparation v1, NUL, canonical WritePreparation JSON, NUL, then decoded report bytes."
          },
          "proof": {
            "$ref": "#/components/schemas/BootProof"
          }
        }
      },
