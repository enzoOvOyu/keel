            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "target_uki_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "runtime_input_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "first_boot_public_key": {
            "type": "string",
            "contentEncoding": "base64"
          },
          "installer_kernel_boot_id": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
