            "type": "integer",
            "minimum": 3,
            "maximum": 4096
          },
          "nonce": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "stage": {
            "type": "string",
            "enum": [
              "gpt.write",
              "efi.format",
              "root.format",
              "root.extract",
              "boot.install",
              "seed.install",
              "final.sync",
              "final.verify"
            ]
          },
          "storage_plan_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "gpt_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "checked_at": {
            "type": "string",
            "format": "date-time"
          },
          "valid_until": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "WriteReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "permit_id",
          "storage_plan_sha256",
          "gpt_sha256",
          "rootfs_sha256",
          "target_uki_sha256",
          "outcome",
          "readback_sha256",
          "reason"
        ],
        "properties": {
          "permit_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "storage_plan_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "gpt_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "rootfs_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "target_uki_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "outcome": {
            "type": "string",
            "enum": [
              "written",
              "unknown"
            ]
          },
          "readback_sha256": {
            "type": "string",
            "pattern": "^([a-f0-9]{64})?$",
            "description": "written: domain-separated SHA256 of canonical WriteReadback. unknown: empty. This is an authenticated writer claim matching expected content, not controller-side device observation."
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          }
        }
      },
      "WriteReceiptSubmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "receipt",
          "proof"
