        "properties": {
          "receipt": {
            "$ref": "#/components/schemas/WriteReceipt"
          },
          "proof": {
            "$ref": "#/components/schemas/BootProof"
          }
        }
      },
      "WriteReadback": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "gpt_sha256",
          "rootfs_sha256",
          "target_uki_sha256",
          "ssh_helper_sha256",
          "user_data_sha256",
          "meta_data_sha256"
        ],
        "properties": {
          "gpt_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "rootfs_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "target_uki_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "ssh_helper_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "user_data_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "meta_data_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        },
        "description": "SHA256 input: UTF-8 Keel installation authenticated readback v1, NUL, canonical object JSON in the documented property order. Writer verifies exact GPT edges and fixed installed EFI/helper/seed files; rootfs digest names the approved source archive and is not a hash of the mutable installed filesystem."
      },
