    scope: current_authenticated_account
  project:read:
    scope: authorized_project_membership_or_platform_admin
  project:create:
    scope: platform_admin
  user:read:
    scope: platform_admin
  user:manage:
    scope: platform_admin
  audit:read:
    scope: platform_admin
  project:members:read:
    scope: project_admin_or_platform_admin
  project:members:manage:
    scope: project_admin_or_platform_admin
  project:audit:read:
    scope: project_admin_or_platform_admin
  sim:target:read:
    scope: authorized_project_membership_or_platform_admin
  flow:read:
    scope: authorized_project_membership_or_platform_admin
  execution:read:
    scope: authorized_project_membership_or_platform_admin
  sim:target:register:
    scope: project_admin_sre_or_platform_admin
  flow:publish:
    scope: project_admin_sre_or_platform_admin
  execution:create:
    scope: project_admin_de_dl_sre_or_platform_admin
  execution:control:
    scope: project_admin_de_dl_sre_or_platform_admin
  execution:reconcile:
    scope: project_admin_dl_sre_or_platform_admin
  model:read:
    scope: authorized_project_membership_or_platform_admin
  model:manage:
    scope: project_admin_or_platform_admin
roles:
  Viewer:
  - project:read
  - account:password
  - sim:target:read
  - flow:read
  - execution:read
  - model:read
  DE:
  - project:read
  - account:password
  - sim:target:read
  - flow:read
  - execution:read
  - model:read
  - execution:create
  - execution:control
  DL:
  - project:read
  - account:password
  - sim:target:read
  - flow:read
  - execution:read
  - execution:create
  - execution:control
  - execution:reconcile
  NE:
  - project:read
  - account:password
  - sim:target:read
  - flow:read
  - execution:read
  - model:read
  SRE:
  - project:read
  - account:password
  - sim:target:read
  - flow:read
  - execution:read
  - sim:target:register
  - flow:publish
  - execution:create
  - execution:control
  - execution:reconcile
  Admin:
  - project:read
  - account:password
  - project:members:read
  - project:members:manage
  - project:audit:read
  - sim:target:read
  - flow:read
  - execution:read
  - sim:target:register
  - flow:publish
  - execution:create
  - execution:control
  - execution:reconcile
platform_admin:
- project:read
- project:create
- account:password
- user:read
- user:manage
- audit:read
- project:members:read
- project:members:manage
- project:audit:read
- sim:target:read
- flow:read
- execution:read
- sim:target:register
- flow:publish
- execution:create
- execution:control
- execution:reconcile
notes:
- Project Admin authority applies only to that project's members and redacted audit,
  not platform accounts.
- Session permissions advertise implemented actions; every project route rechecks
  its own project scope.
- Unimplemented permissions are denied. Admin never implicitly bypasses delivery approvals.
- Identity or membership changes increment security_version and revoke existing sessions.
- Preserve the last active platform administrator and the last active administrator
  of every project.
- Audit APIs expose a scalar metadata allowlist; passwords, hashes, cookies, tokens
  and source IPs are excluded.
- Execution capabilities in this increment apply to the explicit simulation transport;
  external hardware execution is not enabled.
