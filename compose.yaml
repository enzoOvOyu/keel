name: keel
services:
  api:
    image: ${KEEL_IMAGE:-keel:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      KEEL_ENV: ${KEEL_ENV:-development}
      KEEL_DATABASE_URL: ${KEEL_DATABASE_URL:-}
      KEEL_PUBLIC_ORIGINS: ${KEEL_PUBLIC_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KEEL_INSECURE_DEV_COOKIE: ${KEEL_INSECURE_DEV_COOKIE:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  postgres:
    profiles: [data]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keel}
      POSTGRES_DB: ${POSTGRES_DB:-keel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    profiles: [data]
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  minio:
    profiles: [data]
    image: keel-minio:2025-10-15-9e49d5e
    command: [server, /data, --console-address, ":9001", --certs-dir, /tmp/certs]
    build:
      context: ./infra/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
volumes:
  postgres_data:
  redis_data:
  minio_data:
